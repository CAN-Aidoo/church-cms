# Koyeb Service Configuration
# Learn more: https://www.koyeb.com/docs

services:
  - name: church-cms
    type: web
    instance_type: nano  # Change to 'small' or 'medium' in production

    # Build configuration
    build:
      builder: docker
      dockerfile: Dockerfile
      buildpack_build_command: ""

    # Runtime configuration
    ports:
      - port: 80
        protocol: http

    # Environment variables (set these in Koyeb dashboard)
    env:
      - name: APP_NAME
        value: "Church CMS"
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: LOG_CHANNEL
        value: stack
      - name: LOG_LEVEL
        value: error

      # WARNING: APP_KEY is REQUIRED - Application will fail without it
      # Generate locally with: php artisan key:generate --show
      # Then create a Koyeb secret named 'APP_KEY' with the generated value
      - name: APP_KEY
        secret: APP_KEY  # Reference to Koyeb secret

      # URLs - REQUIRED for asset loading and routing
      - name: APP_URL
        value: https://your-app-name.koyeb.app  # Replace with your actual Koyeb URL
      - name: ASSET_URL
        value: https://your-app-name.koyeb.app  # Replace with your actual Koyeb URL

      # Database - REQUIRED (create these as Koyeb secrets)
      - name: DB_CONNECTION
        value: mysql
      - name: DB_HOST
        secret: DB_HOST  # Create secret in Koyeb dashboard
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        secret: DB_DATABASE  # Create secret in Koyeb dashboard
      - name: DB_USERNAME
        secret: DB_USERNAME  # Create secret in Koyeb dashboard
      - name: DB_PASSWORD
        secret: DB_PASSWORD  # Create secret in Koyeb dashboard

      # Session & Cache
      - name: SESSION_DRIVER
        value: database
      - name: SESSION_LIFETIME
        value: "120"
      - name: SESSION_SECURE_COOKIE
        value: "true"
      - name: CACHE_DRIVER
        value: database
      - name: QUEUE_CONNECTION
        value: database

      # Production settings
      - name: APP_TIMEZONE
        value: UTC  # Change to your timezone
      - name: TRUSTED_PROXIES
        value: "*"  # Required for Koyeb proxy detection

    # Health check
    health_checks:
      - http:
          path: /
          port: 80
          interval: 30
          timeout: 5
          success_threshold: 1
          failure_threshold: 3

    # Auto-scaling (optional)
    scaling:
      min: 1
      max: 1  # Increase for auto-scaling

    # Regions
    regions:
      - fra  # Frankfurt - change to your preferred region

    # Restart policy
    auto_deploy: true

    # Resource limits
    resources:
      memory: 512Mi  # Minimum for Laravel
      cpu: 0.5       # 0.5 vCPU

# Notes for deployment:
# 1. Set APP_KEY in Koyeb dashboard (run: php artisan key:generate --show)
# 2. Configure database connection in Koyeb dashboard
# 3. Set APP_URL to your Koyeb URL (e.g., https://your-app.koyeb.app)
# 4. Add payment gateway credentials (Paystack, Hubtel)
# 5. Configure Twilio for SMS (optional)
# 6. Set ASSET_URL to your Koyeb URL for proper asset loading
