# Koyeb Service Configuration
# Learn more: https://www.koyeb.com/docs

services:
  - name: church-cms
    type: web
    instance_type: nano  # Change to 'small' or 'medium' in production

    # Build configuration - Using Buildpack for PHP/Laravel
    build:
      builder: buildpack
      buildpack_build_command: "composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache && php artisan view:cache"

    # Runtime configuration
    ports:
      - port: 80
        protocol: http

    # Environment variables (set these in Koyeb dashboard)
    env:
      - name: APP_NAME
        value: "Church CMS"
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: LOG_CHANNEL
        value: stack
      - name: LOG_LEVEL
        value: error

      # WARNING: APP_KEY is REQUIRED - Application will fail without it
      # Generate locally with: php artisan key:generate --show
      # Then create a Koyeb secret named 'APP_KEY' with the generated value
      - name: APP_KEY
        secret: APP_KEY  # Reference to Koyeb secret

      # URLs - REQUIRED for asset loading and routing
      - name: APP_URL
        value: https://your-app-name.koyeb.app  # Replace with your actual Koyeb URL
      - name: ASSET_URL
        value: https://your-app-name.koyeb.app  # Replace with your actual Koyeb URL

      # Database - REQUIRED (use external MySQL database)
      # NOTE: Koyeb's managed database service only supports PostgreSQL
      # You MUST use an external MySQL provider like:
      # - PlanetScale (https://planetscale.com) - Free tier available
      # - Railway (https://railway.app) - MySQL database service
      # - Aiven (https://aiven.io) - Managed MySQL
      # - Or any other MySQL hosting provider
      - name: DB_CONNECTION
        value: mysql
      - name: DB_HOST
        secret: DB_HOST  # Your external MySQL host (create secret in Koyeb)
      - name: DB_PORT
        value: "3306"
      - name: DB_DATABASE
        secret: DB_DATABASE  # Your database name (create secret in Koyeb)
      - name: DB_USERNAME
        secret: DB_USERNAME  # Your database username (create secret in Koyeb)
      - name: DB_PASSWORD
        secret: DB_PASSWORD  # Your database password (create secret in Koyeb)

      # Session & Cache
      - name: SESSION_DRIVER
        value: database
      - name: SESSION_LIFETIME
        value: "120"
      - name: SESSION_SECURE_COOKIE
        value: "true"
      - name: CACHE_DRIVER
        value: database
      - name: QUEUE_CONNECTION
        value: database

      # Production settings
      - name: APP_TIMEZONE
        value: UTC  # Change to your timezone
      - name: TRUSTED_PROXIES
        value: "*"  # Required for Koyeb proxy detection

    # Health check
    health_checks:
      - http:
          path: /
          port: 80
          interval: 30
          timeout: 5
          success_threshold: 1
          failure_threshold: 3

    # Auto-scaling (optional)
    scaling:
      min: 1
      max: 1  # Increase for auto-scaling

    # Regions
    regions:
      - fra  # Frankfurt - change to your preferred region

    # Restart policy
    auto_deploy: true

    # Resource limits
    resources:
      memory: 512Mi  # Minimum for Laravel
      cpu: 0.5       # 0.5 vCPU

# Notes for deployment:
# 1. IMPORTANT: Create an external MySQL database first
#    - Koyeb web service uses buildpack (NOT Docker)
#    - Koyeb database service only supports PostgreSQL
#    - Use PlanetScale, Railway, Aiven, or another MySQL provider
# 2. Set APP_KEY in Koyeb dashboard (run: php artisan key:generate --show)
# 3. Configure external MySQL database credentials as Koyeb secrets
# 4. Set APP_URL and ASSET_URL to your Koyeb URL (e.g., https://your-app.koyeb.app)
# 5. Add payment gateway credentials (Paystack, Hubtel) - optional
# 6. Configure Twilio for SMS (optional)
# 7. Deployment uses buildpack builder with automatic PHP/Laravel detection
