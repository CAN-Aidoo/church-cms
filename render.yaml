services:
  - type: web
    name: church-cms
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Sonlife City Church CMS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: church-cms
          property: hostURL
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        sync: false
      - key: DB_SSL_MODE
        sync: false
      - key: DB_SSL_VERIFY
        value: "true"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Sonlife City Church"
      # Church Configuration
      - key: CHURCH_NAME
        value: "Sonlife City Church"
      - key: CHURCH_ADDRESS
        value: "Opposite Residency Street, Sunyani, Ghana"
      - key: CHURCH_PHONE
        value: "+233240271064"
      - key: CHURCH_EMAIL
        value: "info@sonlifechurch.com"
      # Twilio SMS
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: TWILIO_ENABLED
        value: "true"
      # Financial Settings
      - key: CURRENCY
        value: "GHS"
      - key: DUAL_APPROVAL_THRESHOLD
        value: "5000"
      # Feature Flags
      - key: ENABLE_SMS_BROADCASTS
        value: "true"
      - key: ENABLE_ONLINE_GIVING
        value: "false"
      - key: ENABLE_TWO_FACTOR_AUTH
        value: "false"
