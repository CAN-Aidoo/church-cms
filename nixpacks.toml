[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "php82Extensions.mbstring", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.bcmath", "php82Extensions.fileinfo", "nodejs_20", "npm"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --no-scripts",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build",
  "composer dump-autoload",
  "php artisan package:discover --ansi || true"
]

[start]
cmd = "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs && chmod -R 775 storage bootstrap/cache && php artisan config:clear && php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
